<!DOCTYPE html>
<html lang="en">

    <style>
        /* அனைத்து CSS code இங்கே */
        /* PLAYER PROFILE PAGE */

.profile-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    padding:40px;
}

.profile-card{
    width:700px;
    background:#1b1b1b;
    border:3px solid #ff9800;
    border-radius:20px;
    padding:30px;
    text-align:center;
    color:white;
}

.profile-card img{
    width:260px;
    height:340px;
    object-fit:cover;
    border-radius:15px;
    border:4px solid gold;
    margin-bottom:20px;
}

.profile-card h1{
    color:#FFD700;
    margin-bottom:10px;
}

.profile-card h2{
    color:#ff9800;
    margin-bottom:20px;
}

.profile-card p,
.profile-card li{
    font-size:18px;
    margin:10px 0;
    line-height:1.6;
}

.profile-card ul{
    list-style:none;
    padding:0;
}

.profile-card button{
    margin-top:20px;
    padding:12px 30px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
}

.profile-card button:hover{
    background:#ff5722;
}
    </style>

</head>

</html>
